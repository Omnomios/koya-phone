[screen]
# Follow accelerometer orientation while the display is on. Disabling keeps the
# current orientation. Sensors are released while inactive or the display is off.
auto-rotate=true

[idle]
# Inactivity before locking and powering off during normal use.
lock-seconds=120
# Inactivity before powering off when the swipe lock screen is visible.
lock-screen-seconds=30
# Suspend once after this long with the display off. Respect sleep inhibitors.
# An inhibited/failed attempt waits for the next screen-off cycle; no retries.
suspend-seconds=180
# Values are seconds; 0 disables that timeout. Restart tinydm after changing.

[volume]
buttons-enabled=true
indicator-enabled=true
# Each press/repeat changes the selected output by this many percentage points.
step-percent=5
maximum-percent=100
timeout-ms=1800
# Indicator positioning uses logical pixels at the compositor's scale.
side=left
margin=16
position-percent=50
# Buttons can change audio while locked/off; the indicator never wakes the screen.
while-locked=true
# Empty follows PulseAudio's default output, including headset route changes.
sink=

[haptics]
enabled=true
# Rate-limit touch/volume feedback without an interval or polling timer.
minimum-interval-ms=45

[brightness]
# Keep the slider's lowest setting usable. Screen-off continues to use DPMS.
minimum-percent=5
